{{ define "main" }}
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Params.description }}<p class="lead">{{ . }}</p>{{ end }}
  </header>
  <section class="post-list">
    {{ range .Pages.ByDate.Reverse }}
      {{ if eq $.Kind "taxonomy" }}
        <article class="post-card">
          <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        </article>
      {{ else }}
        {{ partial "post-card.html" . }}
      {{ end }}
    {{ else }}
      <p>No posts yet.</p>
    {{ end }}
  </section>
{{ end }}
