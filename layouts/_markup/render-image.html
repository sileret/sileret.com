{{- $destination := .Destination -}}
{{- $src := $destination -}}
{{- with .Page.Resources.GetMatch $destination -}}
  {{- $src = .RelPermalink -}}
{{- end -}}
{{- if .Title -}}
<figure class="image-figure">
  <a href="{{ $src | safeURL }}">
    <img
      src="{{ $src | safeURL }}"
      alt="{{ .PlainText }}"
      loading="lazy"
      decoding="async"
      title="{{ .Title }}"
    >
  </a>
  <figcaption class="tag image-caption">{{ .Title }}</figcaption>
</figure>
{{- else -}}
<a href="{{ $src | safeURL }}">
  <img
    src="{{ $src | safeURL }}"
    alt="{{ .PlainText }}"
    loading="lazy"
    decoding="async"
  >
</a>
{{- end -}}
