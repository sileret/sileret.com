backend:
  name: github
  repo: sileret/sileret.com
  branch: codex/private-blog
site_url: https://sileret.com
display_url: https://sileret.com
media_folder: static/uploads
public_folder: /uploads
collections:
  - name: posts
    label: Articles and thoughts
    folder: content/posts
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    delete: false
    extension: md
    format: yaml-frontmatter
    preview_path: 'posts/{{slug}}/'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Published, widget: datetime }
      - { name: lastmod, label: Updated, widget: datetime, required: false }
      - { name: draft, label: Draft, widget: boolean, default: true }
      - name: format
        label: Format
        widget: select
        options: [article, thought]
        default: article
      - { name: comments, label: Allow comments, widget: boolean, default: true }
      - { name: comment_id, label: Permanent comment ID, widget: uuid, read_only: true }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: body, label: Content, widget: markdown }
